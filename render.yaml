# Preparation only. Applying this blueprint requires user approval and no payment method.
previews:
  generation: 'off'
services:
  - type: web
    name: routecast-api
    runtime: python
    plan: free
    rootDir: backend
    autoDeployTrigger: 'off'
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: UV_VERSION
        value: 0.13.5
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ROUTING_PROVIDER
        value: ors
      - key: ORS_API_KEY
        sync: false
      - key: ORS_BASE_URL
        value: https://api.heigit.org/openrouteservice
      - key: ORS_GEOCODING_BASE_URL
        value: https://api.heigit.org/pelias/v1
      - key: CORS_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: routecast-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
